name: Static dashboard smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - qa/dashboard-smoke-tests

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard and landing page
        run: node scripts/smoke-check.mjs
