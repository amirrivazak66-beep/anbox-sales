name: Browser smoke checks (mock data only)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - qa/browser-smoke-tests

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install temporary Playwright test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            git show HEAD^1:index.html > "$RUNNER_TEMP/landing-before.html"
            export LANDING_BASELINE_HTML="$RUNNER_TEMP/landing-before.html"
          fi
          node scripts/browser-smoke.mjs

      - name: Upload landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-preview-screenshots
          path: artifacts/landing-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify isolated PR61 preview URL and login adapter
        run: |
          set -euo pipefail
          BASE="https://uaydruhkevdmvpyefdjm.supabase.co/functions/v1/modirnegar-pr61-preview"
          curl --fail --show-error --location --retry 3 --max-time 30 "$BASE/dashboard.html" -o /tmp/modirnegar-preview-dashboard.html
          grep -Fq "signInWithPassword" /tmp/modirnegar-preview-dashboard.html
          grep -Fq "مدیریت لیدها" /tmp/modirnegar-preview-dashboard.html
          curl --fail --show-error --location --retry 3 --max-time 30 "$BASE/scripts/unified-leads.js" -o /tmp/modirnegar-preview-unified.js
          grep -Fq "ManagerNegarUnifiedLeads" /tmp/modirnegar-preview-unified.js

      - name: Upload role preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-leads-role-previews
          path: artifacts/unified-leads-*.png
          if-no-files-found: ignore
          retention-days: 14
